(()=>{const F=window.COPY_FULL||{groups:{},seo:{},img:{}},C0=window.COPY_CATALOG,
C={...C0,items:C0.items.map(r=>[r[0],r[1],r[2].map(g=>[g[0],g[1],(F.groups[g[1]]?.length?F.groups[g[1]]:g[2]),...g.slice(3)]),...r.slice(3)])},IMG=Object.assign({},F.img,window.COPY_IMG),B=C.base,q=new URLSearchParams(location.search);
const slug=u=>u.split('/').filter(Boolean).pop(),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
const prod=u=>window.COPY_CATALOG.url(u);
const PG=new Set(["/catalog/broshyurovka/","/catalog/fotopechat-onlajn/","/catalog/interernaya-pechat-onlajn-zakaz/","/catalog/kopirovanie-dokumentov/","/catalog/laminirovanie-dokumentov/","/catalog/listovaya-pechat-onlajn/","/catalog/listovaya-poligrafiya/","/catalog/naklejki-onlajn/","/catalog/odezhda-i-tekstil-onlajn/","/catalog/pechat-dokumentov/","/catalog/pechat-foto-na-dokumenty/","/catalog/pechat-fotografij/","/catalog/pechat-fotokalendarej/","/catalog/pechat-fotoknig/","/catalog/pechat-kalendarej/","/catalog/pechat-nakleek/","/catalog/pechat-proektnoj-dokumentaczii/","/catalog/pechat-vizitok/","/catalog/pechati-i-shtampy-onlajn/","/catalog/reklamnye-konstrukczii/","/catalog/skanirovanie-dokumentov/","/catalog/stikerpaki/","/catalog/suveniry-onlajn/","/catalog/tverdyj-pereplet/"]);
const gUrl=g=>g[2].length&&!PG.has(g[1])?'catalog/'+slug(g[1])+'/':prod(g[1]),rUrl=r=>'catalog/'+slug(r[1])+'/';
const tile=(name,href,img)=>`<a href="${href}"><b>${esc(name)}</b>${img?`<img class="ob-w" src="${img.startsWith('/')?B+img:img}" alt="" loading="lazy" decoding="async">`:''}</a>`;
const word=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
let R=null,G=null;
const key=q.get('r')||q.get('g')||(location.pathname.match(/\/catalog\/([^/]+)\/?$/)||[])[1];
R=C.items.find(r=>slug(r[1])===key)||null;
if(!R)for(const r of C.items)for(const g of r[2])if(!G&&g[2].length&&slug(g[1])===key){R=r;G=g}
if(G&&PG.has(G[1])){location.replace(prod(G[1]));return}
if(!R){location.replace('home.html#cat');return}
const cr=[['Главная','home.html']];if(R)cr.push([R[0],rUrl(R)]);if(G)cr.push([G[0]]);
const last=cr.pop();document.getElementById('crumbs').innerHTML=cr.map(([n,h])=>`<a href="${h}">${esc(n)}</a><span>/</span>`).join('')+`<span>${esc(last[0])}</span>`;
const title=G?G[0]:R[0];document.getElementById('catH').textContent=title;document.title=title+' — COPY.RU (прототип)';
const LEAD={'copy-center':'Печать и копирование документов, сканирование, ламинирование, брошюровка и твёрдый переплёт.',
'photopechat':'Фото любого размера, фото на документы, фотокниги, фотокалендари и сувениры с вашими снимками.',
'operativnaya-poligrafiya':'Визитки, листовки, буклеты, открытки и наклейки. Небольшие тиражи в короткие сроки.',
'shirokoformatnaya-pechat':'Плакаты, баннеры, интерьерная и наружная печать, чертежи больших форматов.',
'typographia':'Большие тиражи: каталоги, журналы, календари, коробки, упаковка, этикетки, папки.',
'graficheskij-dizajn':'Дизайн визиток, листовок, каталогов, баннеров, упаковки и фирменного стиля. Подготовим макет к печати.',
'korporativnye-suveniry':'Одежда, посуда, ручки, сумки, ежедневники и подарочные наборы с вашим логотипом.',
'tematicheskaya-poligrafiya':'Полиграфия под задачу: для ресторанов, свадеб, выставок, маркетплейсов и праздников.',
'poligraficheskie-tehnologii':'Способы печати и отделки: ламинация, тиснение, лак, брошюровка и переплёт.',
'online-typographia':'Листовки, наклейки, стикерпаки, фото, сувениры и печати. Заказ на сайте, без визита в копицентр.'};
const lead=!G&&R&&LEAD[slug(R[1])];if(lead){const l=document.getElementById('catL');l.textContent=lead;l.hidden=false}

if(G){
  top.innerHTML=G[2].map(s=>tile(s[0],prod(s[1]),IMG[s[1]])).join('');top.hidden=false;
}else{
  const isB=g=>g[2].length;
  const pgs=R[2].filter(isB),solo=R[2].filter(g=>!g[2].length).concat((F.extra[slug(R[1])]||[]).map(([n,u])=>[n,u,[]])), grp=R[2].filter(g=>g[2].length&&!isB(g)),VC=6;
