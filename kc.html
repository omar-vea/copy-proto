  if(G.length>1){gn.innerHTML=G.map((_,i)=>`<button type="button" data-i="${i}" aria-label="Фото ${i+1}"></button>`).join('');
    const step=()=>sd.children[1].offsetLeft-sd.children[0].offsetLeft,at=()=>sd.scrollLeft>=sd.scrollWidth-sd.clientWidth-2?G.length-1:Math.round(sd.scrollLeft/step()),
    upd=()=>[...gn.children].forEach((b,i)=>b.toggleAttribute('aria-current',i===at()));
    sd.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});upd();
    gn.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)sd.scrollTo({left:b.dataset.i*step(),behavior:'smooth'})})}
  else gn.remove()}
if(S){$('local').hidden=false;
  $('lcP').innerHTML=(S.perks||[]).map(([b,t])=>`<li><b>${E(b)}</b><span>${E(t)}</span></li>`).join('');
  const tg=S.msg||M.tg||'#',r=[];
  if(S.b2b)r.push(`<div class="lc-c"><h3>${E(S.b2b.h)}</h3><p>${E(S.b2b.p)}</p><ul>${S.b2b.items.map(x=>`<li>${E(x)}</li>`).join('')}</ul><a class="btn btn-s" href="${tg}" target="_blank" rel="noopener">${E(S.b2b.cta)}</a></div>`);
  if(S.lead)r.push(`<div class="lc-c lc-q"><blockquote>«${E(S.lead.quote)}»</blockquote>${S.lead.sign?`<img src="${S.lead.sign}" alt="Подпись: ${E(S.lead.name)}" width="160" height="56">`:''}<b>${E(S.lead.name)}</b><span>${E(S.lead.role)}</span></div>`);
  $('lcR').innerHTML=r.join('')}
const K=C.items.find(r=>/copy-center/.test(r[1]));
$('svcH').href=C.url(K[1])||'catalog/copy-center/';
$('svcL').innerHTML=K[2].slice(0,6).map(([t,u])=>`<a href="${C.url(u)}"><b>${E(t)}</b>${IMG[u]?`<img class="ob-img" src="https://copy.ru${IMG[u]}" alt="" loading="lazy">`:''}</a>`).join('');

$('lk').innerHTML=[X.tour&&`<a href="${X.tour}" target="_blank" rel="noopener">3D-тур по копицентру</a>`,`<a href="https://yandex.ru/maps/?text=${encodeURIComponent('COPY.RU '+P.c+', '+P.a)}" target="_blank" rel="noopener">Открыть в Яндекс Картах</a>`].filter(Boolean).join('');
const seo=(X.seo||'').replace(/href="https:\/\/copy\.ru(\/catalog\/[^"]*)"/g,(m,u)=>`href="${C.url(u)}"`);
if(seo){const [a,...b]=seo.split(/(?=<h3>)/);$('seo').innerHTML=a+(b.length?`<details class="seo-more"><summary>Подробнее</summary>${b.join('')}</details>`:'')}else $('seoS').remove();
if(X.req&&X.req.length)$('rqL').innerHTML=X.req.map(([k,v])=>`<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('');else $('rq').remove();
})();
