<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>COPY.RU — прототип</title>
<script>if(matchMedia('(max-width:600px)').matches)location.replace('home.html')</script>
<style>
html,body{margin:0;height:100%}
body{background:#E9E7E2;display:grid;place-items:center;overflow:hidden;font:14px/1.4 system-ui,-apple-system,sans-serif;color:#6b6a66}
/* рамка iPhone 402×874: статус-бар, страница, панель Safari. Цвет полос берётся из фона страницы, как в Safari */
/* экран 402×874 как у iPhone; на низком окне телефон уменьшается целиком (--k), а не сплющивается */
.box{position:fixed;left:50%;top:50%;translate:-50% -50%;scale:var(--k,1)}
.ph{--bar:#fff;--on:#000;width:402px;height:874px;border:10px solid #1b1a1f;border-radius:62px;overflow:hidden;background:var(--bar);box-shadow:0 30px 80px -30px rgba(0,0,0,.35);display:flex;flex-direction:column;position:relative}
.ph iframe{display:block;flex:1;width:100%;border:0;min-height:0}
.sb,.tb{background:var(--bar);color:var(--on);transition:background .2s,color .2s}
.sb{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;position:relative}
.sb i{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb svg{display:block;fill:currentColor}
.tb{flex:none;padding:8px 14px 0;height:84px;box-sizing:border-box}
.tb .row{display:flex;align-items:center;gap:10px}
.tb .bt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on) 8%,var(--bar));flex:none}
.tb .url{flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;background:color-mix(in srgb,var(--on) 8%,var(--bar));font:500 16px -apple-system,system-ui,sans-serif}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tb .url svg{width:15px;height:15px;opacity:.6}
.hi{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--on)}
p{margin:12px 0 0;text-align:center}
</style>
</head>
<body>
<div class="box" id="box">
<div class="ph" id="ph">
  <div class="sb" aria-hidden="true"><span>9:41</span><i></i><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3Zm0 3.5c1.4 0 2.8.5 3.8 1.5l1.2-1.2C12.2 4.8 10.4 4 8.5 4s-3.7.8-5 2.1l1.2 1.2c1-1 2.4-1.5 3.8-1.5Zm0 3.4c-.5 0-1 .2-1.4.6L8.5 11.2l1.4-1.4c-.4-.4-.9-.6-1.4-.6Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".5"/></svg>
  </span></div>
  <iframe id="fr" src="home.html" title="COPY.RU, мобильная версия"></iframe>
  <div class="tb" aria-hidden="true"><div class="row">
    <span class="bt"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></span>
    <span class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>copy.ru</span>
    <span class="bt"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="19" cy="12" r=".6"/></svg></span>
  </div></div>
  <span class="hi"></span>
</div>
<p>Мобильная версия. С телефона: omar-vea.github.io/copy-proto</p>
</div>
<script>
{const fr=document.getElementById("fr"),ph=document.getElementById("ph");
const p=new URLSearchParams(location.search).get("p");if(p&&/^[\w.-]+\.html([?#].*)?$/.test(p))fr.src=p;
// цвет полос = фон body страницы (его же Safari красит в статус-бар), текст — по яркости
let last="";const sync=()=>{try{const d=fr.contentDocument;if(d&&d.body){const c=getComputedStyle(d.body).backgroundColor;if(c!==last){last=c;const m=c.match(/[\d.]+/g)||[255,255,255];const l=(.299*m[0]+.587*m[1]+.114*m[2])/255;ph.style.setProperty("--bar",c);ph.style.setProperty("--on",l>.55?"#000":"#fff")}}}catch(e){}requestAnimationFrame(sync)};sync()}
</script>
<script>{const b=document.getElementById("box"),f=()=>b.style.setProperty("--k",Math.min(1,(innerHeight-24)/b.offsetHeight,(innerWidth-24)/b.offsetWidth));addEventListener("resize",f);f()}</script>
</body>
</html>
